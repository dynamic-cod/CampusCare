{% extends "base.html" %}
{% block title %}Log in | CampusCare{% endblock %}
{% block content %}
  <section class="card">
    <h1>Welcome back</h1>
    <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Log in</button></form>
    <p>New to CampusCare? <a href="{% url 'core:register' %}">Create an account</a>.</p>
  </section>
{% endblock %}
